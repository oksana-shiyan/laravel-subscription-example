services:
  nginx:
    image: nginx:1.18
    depends_on:
      - php-fpm
    environment:
      - NGINX_PORT=80
      - FASTCGI_HOST=php-fpm
      - FASTCGI_PORT=9000
      - DOCUMENT_ROOT=/usr/local/src/laravel-subscription-example/public
      - UPLOAD_MAX_FILESIZE=50M
      - CORS_SERVER_NAME=${CORS_SERVER_NAME}
    ports:
      - ${COMPOSE_NGINX_PORT}:80
    volumes:
      - ./stack/nginx/templates/default.conf.template:/etc/nginx/conf.d/default.conf.template
      - ./stack/nginx/entrypoint.sh:/entrypoint.sh
      - .:/usr/local/src/laravel-subscription-example
    command: "/bin/bash /entrypoint.sh"

  database:
    image: mysql:8.4
    volumes:
      - data:/var/lib/mysql
    ports:
      - ${COMPOSE_DB_PORT}:3306
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=laravel
      - MYSQL_USER=laravel
      - MYSQL_PASSWORD=laravel

  php-fpm:
    image: php:8.5-fpm
    depends_on:
      - database
    links:
      - database
    volumes:
      - .:/usr/local/src/laravel-subscription-example
    working_dir: /usr/local/src/laravel-subscription-example
    environment:
      - COMPOSER_MEMORY_LIMIT=4G

  node:
    image: node:20
    restart: "no"
    working_dir: /usr/local/src/laravel-subscription-example
    ports:
      - "5173:5173"
    volumes:
      - .:/usr/local/src/laravel-subscription-example
    command: "npm run dev -- --host 0.0.0.0 --port 5173"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1288:1025"
      - "8780:8025"
    restart: "no"

volumes:
  data: {}
